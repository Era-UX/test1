<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .table-bordered td, .table-bordered th {
            border-left: 1px solid #e0e0e0 !important;
            border-right: 1px solid #e0e0e0 !important;
            vertical-align: middle;
        }

        .table td, .table th {
            padding: 12px 15px !important;
        }

        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
            transition: 0.2s;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand" href="#" id="uni-name">Loading University...</a>
        <span class="navbar-text text-white" id="uni-address"></span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm bg-white text-center p-3">
                <h5 class="text-muted">Total Students</h5>
                <h2 class="text-primary" id="stat-students">0</h2>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm bg-white text-center p-3">
                <h5 class="text-muted">Total Teachers</h5>
                <h2 class="text-success" id="stat-teachers">0</h2>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div class="input-group w-50">
            <span class="input-group-text bg-white border-end-0">🔍</span>
            <input type="text" class="form-control border-start-0" id="searchInput"
                   placeholder="Search..." onkeyup="handleSearch()">
        </div>
        <button class="btn btn-success" onclick="openEditModal('student')">+ Add Person</button>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Person</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <input type="hidden" id="editId" value="">
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" id="inputType" onchange="toggleFields()">
                                <option value="student">Student</option>
                                <option value="teacher">Teacher</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="inputName" required>
                        </div>
                        <div class="mb-3" id="field-age">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" id="inputAge" value="18">
                        </div>
                        <div id="teacher-fields" style="display:none;">
                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <input type="text" class="form-control" id="inputSubject">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" class="form-control" id="inputExp" value="1">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="submitCreate()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white font-weight-bold">🎓 Students List</div>
        <div class="card-body p-0">
            <table class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                <tr id="students-header"> <th style="cursor:pointer" onclick="sortStudents('fakeId')">ID ↕</th>
                    <th style="cursor:pointer" onclick="sortStudents('name')">Name ↕</th>
                    <th style="cursor:pointer" onclick="sortStudents('age')">Age ↕</th>
                    <th>Curator</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="students-table"></tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white font-weight-bold">👨‍🏫 Teachers List</div>
        <div class="card-body p-0">
            <table class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                <tr id="teachers-header"> <th style="cursor:pointer" onclick="sortTeachers('fakeId')">ID ↕</th>
                    <th style="cursor:pointer" onclick="sortTeachers('name')">Name ↕</th>
                    <th style="cursor:pointer" onclick="sortTeachers('subject')">Subject ↕</th>
                    <th style="cursor:pointer" onclick="sortTeachers('experience')">Exp ↕</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="teachers-table"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
